name: Update flake input

on:
  workflow_dispatch:
    inputs:
      host:
        description: "The host directory under hosts/ (per-host flake)"
        required: true
        type: string
      input:
        description: "The flake input to update"
        required: true
        type: string
      title:
        description: "The commit title"
        required: true
        type: string
      body:
        description: "The commit body"
        required: false
        default: ""
        type: string
      base:
        description: "The base branch to create the PR against"
        required: false
        default: "main"
        type: string

jobs:
  update-flake-input:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: hosts/${{ inputs.host }}
        run: |
          set +e
          set +o pipefail

          nix flake update "${{ inputs.input }}"

          branch="update-flake-input/${{ inputs.input }}"
          git switch -c "$branch"
          git commit --all --message "${{ inputs.title }}" --message "${{ inputs.body }}"
          git push --force-with-lease origin "$branch"
          gh pr create --fill --base "${{ inputs.base }}"
