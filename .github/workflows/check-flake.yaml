on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "hosts/**"
      - "configs/**"
      - "modules/**"
      - "lib/**"
      - "overlays/**"
      - "pkgs/**"
      - "themes/**"
      - ".github/workflows/check-flake.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # aarch64-darwin
    timeout-minutes: 90
    strategy:
      matrix:
        host: [endfield]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # configs/nix-darwin/nix.nix と同じ substituter (llm-agents 等のビルド済みバイナリ)
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Build darwin system
        working-directory: hosts/${{ matrix.host }}
        run: |
          nix build './#darwinConfigurations."${{ matrix.host }}".config.system.build.toplevel' \
            --no-link --print-build-logs --show-trace
