# パッケージ宣言。run_onchange_10-install-packages.ps1.tmpl が冪等に収束させる。
# 注意: 収束は追加のみ (apply-only)。ここから消してもアンインストールはされない。

[packages]
# GUI アプリ・ランタイム類 (ユーザースコープでインストール)
winget = [
    "Git.Git",
    "twpayne.chezmoi",
    "jdx.mise",
    "Microsoft.DSC",
]

# マシンスコープ (要管理者昇格) + インストーラ引数が必要なもの
[[packages.winget_machine]]
id = "Microsoft.VisualStudio.BuildTools" # VS 2026 Build Tools
# Rust (MSVC) のリンクに必要な C++ ツールチェーン + Windows SDK
override = "--passive --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"

[packages.scoop]
# CLI 開発ツール (ユーザーランド・バージョン隔離)
buckets = ["main", "versions"]
apps = [
    "gh",
    "ghq",
    "nu",
    "fzf",
    "wezterm-nightly", # stable が 2024 年で停止しているため nightly (versions バケット)
]
